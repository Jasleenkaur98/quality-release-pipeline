name: Continuous Integration & Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  ENVIRONMENT: "staging"
  # Fetch secrets securely from GitHub Repository Secrets
  API_KEY: ${{ secrets.STAGING_API_KEY }}
  MIN_COVERAGE: ${{ secrets.QUALITY_THRESHOLD }}

jobs:
  quality-gate-check:
    name: Initial Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Secure Environment Diagnostic
        run: |
          echo "=========================================="
          echo " Executing Day 2 Security & Quality Gate"
          echo " Target Environment: $ENVIRONMENT"
          echo " Minimum Quality Threshold Required: $MIN_COVERAGE%"
          echo "=========================================="
          # Verify secret exists without printing the secret itself
          if [ -n "$API_KEY" ]; then
            echo "Security Check: API Key successfully loaded from GitHub Secrets."
          else
            echo "Security Warning: API Key missing!"
          fi

      - name: Evaluate Automated Quality Gate Rules
        run: |
          echo "Checking Code Coverage Standard..."
          CURRENT_COVERAGE=85
          
          if [ $CURRENT_COVERAGE -ge $MIN_COVERAGE ]; then
            echo "Quality Gate PASSED: Current Coverage ($CURRENT_COVERAGE%) exceeds threshold ($MIN_COVERAGE%)."
          else
            echo "Quality Gate FAILED: Current Coverage ($CURRENT_COVERAGE%) is below required threshold ($MIN_COVERAGE%)."
            exit 1
          fi